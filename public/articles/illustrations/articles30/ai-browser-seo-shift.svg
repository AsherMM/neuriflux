<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="g1" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#102c4a"/>
      <stop offset="55%" stop-color="#07121f"/>
      <stop offset="100%" stop-color="#03070c"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0%" stop-color="#00e6be"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:800 58px Arial, sans-serif;fill:#edf2f7;letter-spacing:-2px}
      .sub{font:500 24px Arial, sans-serif;fill:#8ba3b8}
      .label{font:700 25px Arial, sans-serif;fill:#edf2f7}
      .small{font:500 18px Arial, sans-serif;fill:#8ba3b8}
      .micro{font:700 14px Arial, sans-serif;fill:#00e6be;letter-spacing:2px}
      .card{fill:rgba(13,17,23,.78);stroke:rgba(255,255,255,.12);stroke-width:1.5}
      .line{stroke:url(#cyan);stroke-width:4;fill:none;filter:url(#glow);opacity:.9}
      .dot{fill:#00e6be;filter:url(#glow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <g opacity=".22">
    <line x1="0" y1="0" x2="0" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="80" y1="0" x2="80" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="160" y1="0" x2="160" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="240" y1="0" x2="240" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="320" y1="0" x2="320" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="400" y1="0" x2="400" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="480" y1="0" x2="480" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="560" y1="0" x2="560" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="640" y1="0" x2="640" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="720" y1="0" x2="720" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="800" y1="0" x2="800" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="880" y1="0" x2="880" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="960" y1="0" x2="960" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="1040" y1="0" x2="1040" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="1120" y1="0" x2="1120" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="1200" y1="0" x2="1200" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="1280" y1="0" x2="1280" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="1360" y1="0" x2="1360" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="1440" y1="0" x2="1440" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="1520" y1="0" x2="1520" y2="900" stroke="#00e6be" stroke-width=".5"/><line x1="1600" y1="0" x2="1600" y2="900" stroke="#00e6be" stroke-width=".5"/>
    <line x1="0" y1="0" x2="1600" y2="0" stroke="#00e6be" stroke-width=".5"/><line x1="0" y1="80" x2="1600" y2="80" stroke="#00e6be" stroke-width=".5"/><line x1="0" y1="160" x2="1600" y2="160" stroke="#00e6be" stroke-width=".5"/><line x1="0" y1="240" x2="1600" y2="240" stroke="#00e6be" stroke-width=".5"/><line x1="0" y1="320" x2="1600" y2="320" stroke="#00e6be" stroke-width=".5"/><line x1="0" y1="400" x2="1600" y2="400" stroke="#00e6be" stroke-width=".5"/><line x1="0" y1="480" x2="1600" y2="480" stroke="#00e6be" stroke-width=".5"/><line x1="0" y1="560" x2="1600" y2="560" stroke="#00e6be" stroke-width=".5"/><line x1="0" y1="640" x2="1600" y2="640" stroke="#00e6be" stroke-width=".5"/><line x1="0" y1="720" x2="1600" y2="720" stroke="#00e6be" stroke-width=".5"/><line x1="0" y1="800" x2="1600" y2="800" stroke="#00e6be" stroke-width=".5"/><line x1="0" y1="880" x2="1600" y2="880" stroke="#00e6be" stroke-width=".5"/>
  </g>
  <text x="80" y="100" class="micro">NEURIFLUX EDITORIAL</text>
  <text x="80" y="165" class="title">Le SEO change de surface</text>
  <text x="80" y="205" class="sub">Les agents lisent, résument et sélectionnent les sources avant l&#x27;utilisateur</text>
  
  <g transform="translate(105 290)">
    <rect class="card" x="0" y="0" width="1390" height="430" rx="32"/>
    <text x="70" y="80" class="label">Ancien SEO</text>
    <text x="70" y="122" class="small">ranker • capter le clic • optimiser le mot-clé</text>
    <path class="line" d="M100 220 C255 140, 410 140, 560 220"/>
    <path class="line" d="M100 260 C255 340, 410 340, 560 260"/>
    <circle class="dot" cx="100" cy="240" r="16"/>
    <circle class="dot" cx="560" cy="240" r="16"/>
    <text x="690" y="80" class="label">SEO dans les navigateurs IA</text>
    <text x="690" y="122" class="small">être cité • être compris • produire une analyse originale</text>
    <g transform="translate(690 175)">
      <rect x="0" y="0" width="210" height="62" rx="14" fill="rgba(0,230,190,.12)" stroke="#00e6be"/>
      <text x="24" y="39" class="small">sources fortes</text>
      <rect x="240" y="0" width="210" height="62" rx="14" fill="rgba(59,130,246,.12)" stroke="#3b82f6"/>
      <text x="264" y="39" class="small">données originales</text>
      <rect x="480" y="0" width="210" height="62" rx="14" fill="rgba(168,85,247,.12)" stroke="#a855f7"/>
      <text x="504" y="39" class="small">marque éditoriale</text>
    </g>
    <path class="line" d="M805 300 H1180"/>
    <text x="805" y="355" class="micro">OBJECTIF : DEVENIR UNE SOURCE QUE LES IA VEULENT CITER</text>
  </g>

</svg>