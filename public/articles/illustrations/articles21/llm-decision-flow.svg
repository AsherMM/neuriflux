<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="g1" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#102c4a"/>
      <stop offset="55%" stop-color="#07121f"/>
      <stop offset="100%" stop-color="#03070c"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0%" stop-color="#00e6be"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:800 58px Arial, sans-serif;fill:#edf2f7;letter-spacing:-2px}
      .sub{font:500 24px Arial, sans-serif;fill:#8ba3b8}
      .label{font:700 25px Arial, sans-serif;fill:#edf2f7}
      .small{font:500 18px Arial, sans-serif;fill:#8ba3b8}
      .micro{font:700 14px Arial, sans-serif;fill:#00e6be;letter-spacing:2px}
      .card{fill:rgba(13,17,23,.78);stroke:rgba(255,255,255,.12);stroke-width:1.5}
      .line{stroke:url(#cyan);stroke-width:4;fill:none;filter:url(#glow);opacity:.9}
      .dot{fill:#00e6be;filter:url(#glow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <g opacity=".22">
